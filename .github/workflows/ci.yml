name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # 1. BACKEND BUILD & TEST JOB
  # ===========================================================================
  backend-build-and-test:
    name: Backend - Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x backend/gradlew

      - name: Build and Run Backend Tests
        working-directory: ./backend
        run: ./gradlew clean build test --no-daemon

      - name: Upload Test Reports (if failed)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test/

  # ===========================================================================
  # 2. FRONTEND BUILD & LINT JOB
  # ===========================================================================
  frontend-build:
    name: Frontend - Install & Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint || true

      - name: Build Frontend Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ===========================================================================
  # 3. DOCKER COMPOSE BUILD VALIDATION JOB
  # ===========================================================================
  docker-compose-build:
    name: Docker - Compose Build Validation
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Dummy .env for Compose Build Validation
        run: cp .env.example .env

      - name: Validate and Build Docker Compose Services
        run: |
          docker compose -f docker-compose.yml build
