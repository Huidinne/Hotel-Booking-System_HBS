server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hotel-booking-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:hotel_user}
    password: ${SPRING_DATASOURCE_PASSWORD:hotel_password_secure}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Cấu hình bảo mật JWT
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Cấu hình VNPay Sandbox
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:DEMO_TMN}
  hash-secret: ${VNPAY_HASH_SECRET:DEMO_HASH_SECRET}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment-result}

# Cấu hình Cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:demo_cloud}
  api-key: ${CLOUDINARY_API_KEY:demo_key}
  api-secret: ${CLOUDINARY_API_SECRET:demo_secret}
