# Cấu hình độc lập cho môi trường Test (H2 in-memory DB, không phụ thuộc MySQL ngoài)
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25

# JWT config cho test
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000

# VNPay config cho test
vnpay:
  tmn-code: DEMO_TMN
  hash-secret: DEMO_HASH_SECRET
  pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: http://localhost:5173/payment-result

# Cấu hình Actuator cho môi trường Test
management:
  endpoints:
    web:
      exposure:
        include: ["health", "info", "metrics"]
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
  health:
    mail:
      enabled: false
