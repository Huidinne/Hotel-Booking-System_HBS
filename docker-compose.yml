services:
  # ---------------------------------------------------------------------------
  # 1. DATABASE SERVICE (MySQL 8.0)
  # ---------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: hotel-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_db}
      MYSQL_USER: ${MYSQL_USER:-hotel_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_password_secure}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_secure}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 2. BACKEND API SERVICE (Spring Boot 3 - Java 21)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotel-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql-db:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-hotel_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-hotel_password_secure}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-demo_cloud}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-demo_key}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-demo_secret}
      BANK_CODE: ${BANK_CODE:-}
      BANK_ACCOUNT: ${BANK_ACCOUNT:-}
      BANK_ACCOUNT_NAME: ${BANK_ACCOUNT_NAME:-}
      VIETQR_TEMPLATE: ${VIETQR_TEMPLATE:-compact2}
      PAYMENT_EXPIRE_MINUTES: ${PAYMENT_EXPIRE_MINUTES:-15}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp-relay.brevo.com}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-phanthuanthanh270606@gmail.com}
      APP_MAIL_PERSONAL_NAME: ${APP_MAIL_PERSONAL_NAME:-Grand Aurora Luxury Hotel}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-c28158001@smtp-brevo.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_URL: ${GEMINI_API_URL:-https://generativelanguage.googleapis.com/v1beta/models}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-10000}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - hotel-network

  # ---------------------------------------------------------------------------
  # 3. FRONTEND WEB SERVICE (React 19 + Vite + Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - hotel-network

# -----------------------------------------------------------------------------
# VOLUMES & NETWORKS CONFIGURATION
# -----------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local

networks:
  hotel-network:
    driver: bridge
