server {
    listen 80;
    server_name localhost;

    # Cấu hình tối ưu phục vụ static assets và ảnh 360 Virtual Tour
    location /assets/ {
        root /usr/share/nginx/html;
        # Tắt sendfile để tránh đứt gói tin trong môi trường Docker/VPS ảo hóa
        sendfile off;
        tcp_nopush off;
        tcp_nodelay on;
        # Tắt Range Request đối với ảnh để buộc server luôn trả về HTTP 200 đầy đủ
        max_ranges 0;
        add_header Cache-Control "public, max-age=86400, no-transform";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy tới Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
